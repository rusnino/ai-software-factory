name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  governance-controller-sqlite:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/governance_controller
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.4.x"
      - name: Install dependencies
        run: uv sync
      - name: Run tests (SQLite)
        run: uv run pytest -q
      - name: Lint
        run: uv run ruff check governance_controller tests
      - name: Type check
        run: uv run mypy governance_controller
      - name: Check and test OPA policy
        run: |
          docker compose --profile opa run --rm --no-deps opa check /policy
          docker compose --profile opa run --rm --no-deps opa test /policy

  governance-controller-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: controller
          POSTGRES_PASSWORD: controller
          POSTGRES_DB: controller
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    defaults:
      run:
        working-directory: src/governance_controller
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.4.x"
      - name: Install dependencies
        run: uv sync
      - name: Run tests (Postgres)
        env:
          GC_TEST_DATABASE_URL: postgresql+asyncpg://controller:controller@localhost/controller
        run: uv run pytest -q

  macro-agent-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/macro_agent_service
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.4.x"
      - name: Install dependencies
        run: uv sync
      - name: Run tests
        run: uv run pytest -q
      - name: Lint
        run: uv run ruff check src tests
      - name: Type check
        run: uv run mypy src
