# Dev-only local orchestration. Credentials are intentionally local defaults;
# production uses externally injected secrets.
#
# Ports are bound to 127.0.0.1 only so a dev laptop does not accidentally
# expose Postgres or the API to the local network. Secret variables below are
# set to explicit dev placeholders; rotate them before any non-local exposure.
services:
  db:
    image: postgres:16-alpine
    environment:
      # Dev-only local credentials.
      POSTGRES_USER: controller
      POSTGRES_PASSWORD: controller
      POSTGRES_DB: controller
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U controller -d controller"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    environment:
      # Dev-only local database URL.
      GC_DATABASE_URL: postgresql+asyncpg://controller:controller@db:5432/controller
      GC_LOG_LEVEL: info
      # Dev-only secrets. These must be rotated in any environment where the
      # API, webhooks, intake, or event-bridge endpoints are reachable.
      GC_CONTROLLER_API_SECRET: dev-controller-secret-change-me
      GC_PLANE_WEBHOOK_SECRET: dev-plane-webhook-secret-change-me
      GC_INTAKE_SECRET: dev-intake-secret-change-me
      GC_EVENT_BRIDGE_SECRET: dev-event-bridge-secret-change-me
      # Required for conflict:resolved events that unblock a BLOCKED task;
      # without it, the only documented recovery path returns 401.
      GC_EVENT_BRIDGE_HUMAN_SECRET: dev-event-bridge-human-secret-change-me
      GC_MACRO_AGENT_API_SECRET: dev-macro-agent-secret-change-me
      # Optional service-to-service tokens. Leave empty when services are
      # reached via trusted paths or local sidecars.
      GC_OPA_API_TOKEN: ""
      GC_TELEGRAM_WEBHOOK_SECRET_TOKEN: ""
      GC_PLANE_API_TOKEN: ""
    ports:
      - "127.0.0.1:8000:8000"
    cap_drop:
      - ALL
    depends_on:
      db:
        condition: service_healthy

  # Optional Open Policy Agent (OPA) backend for externalized policy
  # evaluation. Enable this only when the Controller is configured with
  # GC_OPA_BASE_URL pointing at this service. OPA is not required for local
  # development or for the Controller's built-in policy decisions.
  opa:
    image: openpolicyagent/opa:0.68.0
    command:
      - run
      - --server
      - --log-format=json
      - --addr=http://0.0.0.0:8181
    ports:
      - "127.0.0.1:8181:8181"
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8181/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
